<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Pro Chat</title>
    <style>
        :root {
            --bg-color: #212121;
            --sidebar-color: #171717;
            --text-color: #ececec;
            --user-msg-bg: #303030;
            --ai-msg-bg: #2f2f2f;
            --accent-color: #007bff;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        #sidebar {
            width: 280px;
            background-color: var(--sidebar-color);
            padding: 20px;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .model-option {
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .model-option:hover { background: #3d3d3d; }
        .model-option.active {
            border-color: var(--accent-color);
            background: #333;
            box-shadow: 0 0 5px rgba(0,123,255,0.5);
        }

        #clear-btn {
            margin-top: auto;
            padding: 10px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Main Chat Area */
        #chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        #messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .message {
            padding: 15px 20px;
            border-radius: 15px;
            max-width: 85%;
            line-height: 1.6;
            white-space: pre-wrap; /* Preserves line breaks */
            font-size: 1rem;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border-bottom-left-radius: 2px;
            border: 1px solid #333;
        }

        /* Input Area */
        #input-container {
            padding: 20px;
            background-color: var(--bg-color);
        }

        #input-wrapper {
            display: flex;
            background-color: #333;
            border-radius: 12px;
            padding: 8px 15px;
            align-items: center;
            border: 1px solid #444;
        }

        #input-wrapper:focus-within { border-color: var(--accent-color); }

        #user-input {
            flex-grow: 1;
            background: none;
            border: none;
            color: white;
            padding: 10px;
            font-size: 1rem;
            outline: none;
        }

        #send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #send-btn:disabled { background-color: #555; cursor: not-allowed; }

        /* Markdown-ish styling for AI responses */
        code { background: #1a1a1a; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Models</h2>
    <button class="model-option active" onclick="setModel('gemma-4-26b-moe', this)">Gemma 26B (Brain)</button>
    <button class="model-option" onclick="setModel('coding-gemma-4-12b', this)">Gemma 12B (Coder)</button>
    <button class="model-option" onclick="setModel('qwen-3.5-9b', this)">Qwen 9B (Fast)</button>

    <button id="clear-btn" onclick="clearChat()">Clear Conversation</button>
</div>

<div id="chat-area">
    <div id="messages"></div>
    <div id="input-container">
        <div id="input-wrapper">
            <input type="text" id="user-input" placeholder="Ask anything..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>
</div>

<script>
    let currentModel = "gemma-4-26b-moe";
    // This array stores the history of the conversation
    let conversationHistory = [];

    const apiBase = "http://127.0.0.1:8081/v1/chat/completions";

    const messagesContainer = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function setModel(modelName, element) {
        currentModel = modelName;
        document.querySelectorAll('.model-option').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        clearChat(); // Clear chat when switching models to prevent context mismatch
    }

    function clearChat() {
        conversationHistory = [];
        messagesContainer.innerHTML = '';
        appendMessage('ai', 'Conversation cleared. How can I help?');
    }

    function appendMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-message`;
        msgDiv.innerText = text;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return msgDiv;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. Add User message to UI and History
        appendMessage('user', text);
        conversationHistory.push({ role: "user", content: text });
        userInput.value = '';
        sendBtn.disabled = true;

        // 2. Create AI message placeholder for streaming
        const aiMsgDiv = appendMessage('ai', '');
        let fullAiResponse = "";

        try {
            // 3. Fetch with streaming enabled
            const response = await fetch(apiBase, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: currentModel,
                    messages: conversationHistory, // Send the whole history!
                    stream: true // Enable streaming
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            // 4. Process the stream
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                // OpenAI stream format splits messages by "data: "
                const lines = buffer.split('\n');
                buffer = lines.pop(); // Keep the last partial line in the buffer

                for (const line of lines) {
                    const cleanedLine = line.trim();
                    if (!cleanedLine || cleanedLine === 'data: [DONE]') continue;

                    if (cleanedLine.startsWith('data: ')) {
                        const jsonStr = cleanedLine.substring(6);
                        try {
                            const parsed = JSON.parse(jsonStr);
                            const content = parsed.choices[0].delta.content;
                            if (content) {
                                fullAiResponse += content;
                                aiMsgDiv.innerText = fullAiResponse; // Update UI live
                                messagesContainer.scrollTop = messagesContainer.scrollHeight;
                            }
                        } catch (e) {
                            console.error("Error parsing chunk", e);
                        }
                    }
                }
            }

            // 5. Add the final response to history
            conversationHistory.push({ role: "assistant", content: fullAiResponse });

        } catch (error) {
            aiMsgDiv.innerText = "Error: " + error.message + ". Is your server running with CORS enabled?";
            console.error(error);
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Init
    clearChat();
</script>

</body>
</html>
